name: Print context
description: Print GitHub context

inputs:
  data:
    description: Input data to print

runs:
  using: composite
  steps:
    - name: Dump GitHub context
      env:
        CONTEXT_JSON: ${{ toJSON(github) }}
      run: printf '%s\n' "$CONTEXT_JSON"
      shell: bash

    - name: Dump inputs
      env:
        INPUT_DATA_JSON: ${{ toJSON(inputs.data) }}
      run: printf '%s\n' "$INPUT_DATA_JSON"
      shell: bash
