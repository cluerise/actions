name: 🚀 Create release PR

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      app-id:
        description: GitHub app ID
        type: string
      manager:
        description: Package manager (pnpm, npm, or yarn)
        type: string
        default: pnpm
      release-command:
        description: Release command to run instead of releasing using targets
        type: string
      release-target:
        description: Release target name
        type: string
      release-targets:
        description: JSON object defining release targets and their packages
        type: string
        default: '{}'
      npm-config-userconfig:
        description: NPM configuration file path
        type: string
      __external-call:
        description: Do not use this input, it is an internal value to identify the workflow_call event
        type: boolean
        default: true
    secrets:
      token:
        description: GitHub access token
        required: false
      app-private-key:
        description: GitHub app private key
        required: false
      npm-auth-token:
        description: NPM authentication token for private packages
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  create-release-pr:
    name: Create release PR
    runs-on: ubuntu-latest

    steps:
      - name: Check required inputs
        if: inputs.__external-call
        run: |
          if ${{
            (secrets.token == '' && (inputs.app-id == '' || secrets.app-private-key == '')) ||
            (secrets.token != '' && (inputs.app-id != '' || secrets.app-private-key != ''))
          }}; then
            echo '::error::Provide either token alone or both app-id and app-private-key without token.'
            exit 1
          fi

      - name: Get app token (internal)
        id: get-app-token-internal
        if: ${{ !inputs.__external-call }}
        uses: cluerise/actions/get-github-app-token@main
        with:
          app-id: ${{ vars.CLUERISE_PUBLIC_BOT_APP_ID }}
          app-private-key: ${{ secrets.CLUERISE_PUBLIC_BOT_APP_PRIVATE_KEY }}

      - name: Get app token (external)
        id: get-app-token-external
        if: inputs.__external-call && inputs.app-id != ''
        uses: cluerise/actions/get-github-app-token@v7.5.4
        with:
          app-id: ${{ inputs.app-id }}
          app-private-key: ${{ secrets.app-private-key }}

      - name: Install (internal)
        if: ${{ !inputs.__external-call }}
        uses: cluerise/actions/install@main
        with:
          fetch-depth: 0

      - name: Install (external)
        env:
          NPM_AUTH_TOKEN: ${{ secrets.npm-auth-token }}
          NPM_CONFIG_USERCONFIG: ${{ inputs.npm-config-userconfig }}
        if: inputs.__external-call
        uses: cluerise/actions/install@v7.5.4
        with:
          manager: ${{ inputs.manager }}
          fetch-depth: 0

      - name: Run the release command
        id: release-command
        if: inputs.release-target == '' || !inputs.__external-call
        run: ${{ inputs.release-command || 'pnpm run release create' }}

      - name: Set Git user for temporary commits
        if: inputs.release-target != ''
        run: |
          git config user.name "Cluerise Bot"
          git config user.email "bot@cluerise.com"

      - name: Run the release command for targets
        id: release-targets
        if: inputs.release-target != ''
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const getPackageScope = async (packageName) => {
              const prodCommand = `pnpm ls -r ${packageName} --json | grep dependencies | wc -l`;
              const devCommand = `pnpm ls -r ${packageName} --json | grep devDependencies | wc -l`;

              let prodCommandOutput = '';
              let devCommandOutput = '';

              await exec.exec('/bin/bash', ['-c', prodCommand], {
                listeners: {
                  stdout: (data) => {
                    prodCommandOutput += data.toString();
                  }
                }
              });

              await exec.exec('/bin/bash', ['-c', devCommand], {
                listeners: {
                  stdout: (data) => {
                    devCommandOutput += data.toString();
                  }
                }
              });

              const prodDependencyType = parseInt(prodCommandOutput.trim(), 10) > 0;
              const devDependencyType = parseInt(devCommandOutput.trim(), 10) > 0;

              return prodDependencyType ? 'prod' : devDependencyType ? 'dev' : null;
            };

            const createRelease = async (packageName) => {
              let releaseData = '';
              await exec.exec('pnpm', ['--config.verify-deps-before-run=false', '--filter', packageName, '--silent', 'run', 'release', 'create', '--silent'], {
                listeners: {
                  stdout: (data) => {
                    releaseData += data.toString();
                  }
                }
              });

              if (releaseData.trim().length === 0) {
                return null;
              }

              return JSON.parse(releaseData);
            };

            // -----------------------------------------------------------------

            const targetName = core.getInput('release-target', { required: true });
            const targets = JSON.parse(core.getInput('release-targets', { required: true }));

            const packageNames = targets[targetName];
            if (!packageNames) {
              core.setFailed(`Release target "${targetName}" not found in targets: ${JSON.stringify(Object.keys(targets))}`);
              return;
            }

            const releases = [];

            for (const packageName of packageNames) {
              const release = await createRelease(packageName);

              if (release !== null) {
                releases.push(release);

                const scope = await getPackageScope(packageName);
                const scopeName = scope ? `(${scope})` : '';

                await exec.exec('git', ['stash']);
                await exec.exec('find', ['.', '-type', 'f', '-name', 'package.json', '!', '-path', '*/node_modules/*', '-exec', 'sed', '-i', `s|"${packageName}": "workspace:\\*"|"${packageName}": "${release.versions.to}"|g`, '{}', '+']);
                await exec.exec('git', ['commit', '--allow-empty', '--no-verify', '-a', '-m', `deps${scopeName}: Update ${packageName} ${release.versions.from} to ${release.versions.to}`]);
                await exec.exec('git', ['stash', 'pop']);
              }
            }

            for (const release of releases) {
              core.setOutput('release', release);
              core.setOutput(`release.${release.name}`, release);
            }

          release-target: ${{ inputs.release-target }}
          release-targets: ${{ inputs.release-targets }}

      - name: Remove temporary commits
        if: inputs.release-target != ''
        run: |
          git stash
          git reset --hard @{upstream}
          git stash pop || true

      - name: Release info
        id: release-info
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const commandReleasesInput = JSON.parse(core.getInput('command-releases'));
            const targetReleasesInput = JSON.parse(core.getInput('target-releases'));

            const releasesInput = typeof commandReleasesInput === 'object' && Object.keys(commandReleasesInput).length > 0
              ? commandReleasesInput
              : targetReleasesInput;

            if (!releasesInput.release) {
              core.setOutput('title', 'No release created');
              core.setOutput('body', '');

              return;
            }

            const defaultRelease = JSON.parse(releasesInput.release);

            const releases = Object.entries(releasesInput)
              .filter(([key]) => key.startsWith('release.'))
              .map(([_key, value]) => JSON.parse(value))
              .toSorted((releaseA, releaseB) => releaseA.name.localeCompare(releaseB.name));

            const title = releases.length === 1
              ? `release: Release \`${defaultRelease.tag}\``
              : `release: Release of ${releases.length} packages`;

            const tableRows = [
              ['Name', 'Type', 'Versions', 'Tag'],
              ['---', '---', '---', '---'],
              ...releases.map(release => [
                `\`${release.name}\``,
                release.type,
                release.versions.from ? `\`${release.versions.from}\` to \`${release.versions.to}\`` : `\`${release.versions.to}\``,
                `\`${release.tag}\``
              ])
            ];

            const table = tableRows.map(row => `| ${row.join(' | ')} |`).join('\n');

            core.setOutput('title', title);
            core.setOutput('body', table);

          command-releases: ${{ toJSON(steps.release-command.outputs) }}
          target-releases: ${{ toJSON(steps.release-targets.outputs) }}

      - name: Create a pull request with the release (internal)
        if: ${{ !inputs.__external-call }}
        uses: branoholy/update-files-action@v1.0.1
        with:
          token: ${{ steps.get-app-token-internal.outputs.token }}
          branch.name: release
          branch.recreate: true
          commit.paths: |
            **/package.json
            pnpm-lock.yaml
            package-lock.json
            yarn.lock
            **/CHANGELOG.md
            .github/workflows/*.yaml
          commit.message: ${{ steps.release-info.outputs.title }}
          pull-request.body: ${{ steps.release-info.outputs.body }}
          pull-request.labels: 'type: release'

      - name: Create a pull request with the release (external)
        if: inputs.__external-call
        uses: branoholy/update-files-action@v1.0.1
        with:
          token: ${{ secrets.token || steps.get-app-token-external.outputs.token }}
          branch.name: release
          branch.recreate: true
          commit.paths: |
            **/package.json
            pnpm-lock.yaml
            package-lock.json
            yarn.lock
            **/CHANGELOG.md
            **/*.pbxproj
          commit.message: ${{ steps.release-info.outputs.title }}
          pull-request.body: ${{ steps.release-info.outputs.body }}
          pull-request.labels: 'type: release'
