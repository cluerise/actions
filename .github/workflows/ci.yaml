name: CI

on:
  push:
    branches-ignore:
      - '__*'

concurrency: ci-${{ github.sha }}

env:
  CI: true

permissions:
  contents: read

jobs:
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Install
        uses: cluerise/actions/install@main

  check-types:
    name: Check types
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Install
        uses: cluerise/actions/install@main

      - name: Check types
        run: pnpm run tc

  lint:
    name: Lint files
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Install
        uses: cluerise/actions/install@main

      - name: Lint files
        run: NODE_OPTIONS=--max-old-space-size=8192 pnpm run lint all
