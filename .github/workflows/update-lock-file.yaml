name: 🔒 Update lock file

on:
  schedule:
    - cron: '0 12 * * 3' # Every Wednesday at 12:00 UTC
  workflow_dispatch:
  workflow_call:
    inputs:
      app-id:
        description: GitHub app ID
        type: string
      manager:
        description: Package manager (pnpm, npm, or yarn)
        type: string
        default: pnpm
      node-version:
        description: 'Node.js version to use. Examples: 12.x, 10.15.1, >=10.15.0'
        type: string
      node-version-file:
        description: File containing the Node.js version to use
        type: string
        default: .nvmrc
      npm-config-userconfig:
        description: NPM configuration file path
        type: string
      __external-call:
        description: Do not use this input, it is an internal value to identify the workflow_call event
        type: boolean
        default: true
    secrets:
      token:
        description: GitHub access token
        required: false
      app-private-key:
        description: GitHub app private key
        required: false
      npm-auth-token:
        description: NPM authentication token for private packages
        required: false

concurrency: update-lock-file-workflow

permissions:
  contents: write
  pull-requests: write

jobs:
  update-lock-file:
    name: Update lock file
    runs-on: ubuntu-latest

    steps:
      - name: Check required inputs
        if: inputs.__external-call
        run: |
          if ${{
            (secrets.token == '' && (inputs.app-id == '' || secrets.app-private-key == '')) ||
            (secrets.token != '' && (inputs.app-id != '' || secrets.app-private-key != ''))
          }}; then
            echo '::error::Provide either token alone or both app-id and app-private-key without token.'
            exit 1
          fi

      - name: Get app token (internal)
        id: get-app-token-internal
        if: ${{ !inputs.__external-call }}
        uses: cluerise/actions/get-github-app-token@main
        with:
          app-id: ${{ vars.CLUERISE_PUBLIC_BOT_APP_ID }}
          app-private-key: ${{ secrets.CLUERISE_PUBLIC_BOT_APP_PRIVATE_KEY }}

      - name: Get app token (external)
        id: get-app-token-external
        if: inputs.__external-call && inputs.app-id != ''
        uses: cluerise/actions/get-github-app-token@v7.5.4
        with:
          app-id: ${{ inputs.app-id }}
          app-private-key: ${{ secrets.app-private-key }}

      - name: Install (internal)
        if: ${{ !inputs.__external-call }}
        uses: cluerise/actions/install@main

      - name: Install (external)
        env:
          NPM_AUTH_TOKEN: ${{ secrets.npm-auth-token }}
          NPM_CONFIG_USERCONFIG: ${{ inputs.npm-config-userconfig }}
        if: inputs.__external-call
        uses: cluerise/actions/install@v7.5.4
        with:
          manager: ${{ inputs.manager }}
          node-version: ${{ inputs.node-version }}
          node-version-file: ${{ inputs.node-version-file }}

      - name: Update the PNPM lock file
        env:
          NPM_AUTH_TOKEN: ${{ secrets.npm-auth-token }}
          NPM_CONFIG_USERCONFIG: ${{ inputs.npm-config-userconfig }}
        if: ${{ !inputs.__external-call || inputs.manager == 'pnpm' }}
        run: rm -rf node_modules && rm pnpm-lock.yaml && pnpm install

      - name: Update the NPM lock file
        env:
          NPM_AUTH_TOKEN: ${{ secrets.npm-auth-token }}
          NPM_CONFIG_USERCONFIG: ${{ inputs.npm-config-userconfig }}
        if: inputs.manager == 'npm'
        run: rm -rf node_modules && rm package-lock.json && npm install

      - name: Update the Yarn lock file
        env:
          NPM_AUTH_TOKEN: ${{ secrets.npm-auth-token }}
          NPM_CONFIG_USERCONFIG: ${{ inputs.npm-config-userconfig }}
        if: inputs.manager == 'yarn'
        run: rm -rf node_modules && rm yarn.lock && yarn

      - name: Create a pull request with the updated file
        uses: branoholy/update-files-action@v1.0.1
        with:
          token: ${{ secrets.token || steps.get-app-token-internal.outputs.token || steps.get-app-token-external.outputs.token }}
          branch.name: deps-update-lock-file
          branch.recreate: true
          commit.paths: |
            pnpm-lock.yaml
            package-lock.json
            yarn.lock
          commit.message: 'deps(lock): Update lock file'
          pull-request.body: Automatic update of dependencies in the lock file.
          pull-request.labels: |
            type: deps
            scope: lock
