name: 💬 Comment deployments

on:
  workflow_call:
    inputs:
      app-id:
        description: GitHub app ID
        type: string
      pull-request-number:
        description: Pull request number
        type: number
        default: ${{ github.event.pull_request.number }}
      branch-name:
        description: Branch name
        type: string
        default: ${{ github.head_ref }}
      preview-name:
        description: Preview name (defaults to branch name)
        type: string
        default: ${{ inputs.branch-name }}
      commit-hash:
        description: Commit hash
        type: string
        default: ${{ github.event.pull_request.head.sha }}
      deployments:
        description: JSON array of deployments
        type: string
        required: true
    secrets:
      token:
        description: GitHub access token
        required: false
      app-private-key:
        description: GitHub app private key
        required: false

concurrency:
  group: comment-deployments-${{ inputs.pull-request-number }}
  cancel-in-progress: true

permissions:
  issues: write

jobs:
  comment-deployments:
    name: Comment deployments
    runs-on: ubuntu-latest

    steps:
      - name: Check required inputs
        run: |
          if ${{
            (secrets.token == '' && (inputs.app-id == '' || secrets.app-private-key == '')) ||
            (secrets.token != '' && (inputs.app-id != '' || secrets.app-private-key != ''))
          }}; then
            echo '::error::Provide either token alone or both app-id and app-private-key without token.'
            exit 1
          fi

      - name: Get app token
        id: get-app-token
        if: inputs.app-id != ''
        uses: cluerise/actions/get-github-app-token@v7.5.2
        with:
          app-id: ${{ inputs.app-id }}
          app-private-key: ${{ secrets.app-private-key }}

      - name: Comment
        uses: actions/github-script@v9.0.0
        with:
          pull-request-number: ${{ inputs.pull-request-number }}
          branch-name: ${{ inputs.branch-name }}
          preview-name: ${{ inputs.preview-name }}
          commit-hash: ${{ inputs.commit-hash }}
          deployments: ${{ inputs.deployments }}
          github-token: ${{ secrets.token || steps.get-app-token.outputs.token }}
          script: |
            const commentMarker = '<!-- deployment-comment -->';

            const pullRequestNumber = parseInt(core.getInput('pull-request-number', { required: true }), 10);
            const branchName = core.getInput('branch-name', { required: true });
            const previewName = core.getInput('preview-name') || branchName;
            const commitHash = core.getInput('commit-hash', { required: true });
            const deployments = JSON.parse(core.getInput('deployments', { required: true }));

            const { owner, repo } = context.repo;
            const shortCommitHash = commitHash.slice(0, 10);

            const body = [
              commentMarker,
              '## Deployments',
              '',
              '| Name | Commit | URLs |',
              '| --- | --- | --- |',
              ...deployments.map(
                ({ name, links }) => {
                  const urls = links
                    .map(link => {
                      const url = link.url
                        .replaceAll('%branchName%', branchName)
                        .replaceAll('%previewName%', previewName)
                        .replaceAll('%commitHash%', commitHash)
                        .replaceAll('%shortCommitHash%', shortCommitHash)
                        .replace(/%previewDomain\(\s*(["'])(.*?)\1\s*\)%/g, (_match, _quote, workerName) => {
                          const previewSlug = previewName.replaceAll('.', '-').slice(0, 63 - workerName.length - 1);
                          return `${previewSlug}-${workerName}`;
                        });

                      return `[${link.name}](${url})`;
                    })
                    .join(', ');

                  return `| ${name} | \`${shortCommitHash}\` | ${urls} |`;
                }
              ),
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pullRequestNumber,
              per_page: 100,
            });

            const existingComment = comments.find(
              (comment) => comment.body?.includes(commentMarker),
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pullRequestNumber,
                body,
              });
            }
