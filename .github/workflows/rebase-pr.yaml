name: 🔄 Rebase PR

on:
  workflow_call:
    inputs:
      app-id:
        description: GitHub app ID
        type: string
      pr-id:
        description: ID of the pull request to rebase
        type: string
        default: ${{ github.event.issue.node_id }}
      squash:
        description: Whether to squash the commits in the pull request
        type: boolean
    secrets:
      token:
        description: GitHub access token
        required: false
      app-private-key:
        description: GitHub app private key
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  rebase-pr:
    name: Rebase PR
    runs-on: ubuntu-latest

    steps:
      - name: Check required inputs
        run: |
          if ${{
            (secrets.token == '' && (inputs.app-id == '' || secrets.app-private-key == '')) ||
            (secrets.token != '' && (inputs.app-id != '' || secrets.app-private-key != ''))
          }}; then
            echo '::error::Provide either token alone or both app-id and app-private-key without token.'
            exit 1
          fi

      - name: Get app token
        id: get-app-token
        if: inputs.app-id != ''
        uses: cluerise/actions/get-github-app-token@v7.5.4
        with:
          app-id: ${{ inputs.app-id }}
          app-private-key: ${{ secrets.app-private-key }}

      - name: Rebase PR
        uses: cluerise/actions/rebase-pr@v7.5.4
        with:
          token: ${{ secrets.token || steps.get-app-token.outputs.token }}
          pr-id: ${{ inputs.pr-id }}
          squash: ${{ inputs.squash }}
