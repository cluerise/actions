name: 📱 Publish to Play Store

on:
  workflow_call:
    inputs:
      android-key-alias:
        type: string
        required: true
      manager:
        description: Package manager (pnpm, npm, or yarn)
        type: string
        default: pnpm
      java-version:
        description: Java version to use for building the Android app
        type: string
        required: true
      java-distribution:
        description: Java distribution to use
        type: string
        default: temurin
      build-command:
        description: Build command to run (-PversionCode will be appended to the command)
        type: string
        required: true
      get-release-version-command:
        description: Command to get the release version
        type: string
        required: true
      package-name:
        description: Package name of the Android app (e.g., com.example.app)
        type: string
        required: true
      package-files:
        description: Path to the Android app bundle or APK files to upload
        type: string
        required: true
      play-store-service-account:
        description: Service account email for Play Store authentication
        type: string
        required: true
      play-store-workload-identity-provider:
        description: Workload Identity Provider for Play Store authentication
        type: string
        required: true
      npm-config-userconfig:
        description: NPM configuration file path
        type: string
    secrets:
      android-keystore-base64:
        required: true
      android-keystore-password:
        required: true
      android-key-password:
        required: true
      npm-auth-token:
        description: NPM authentication token for private packages
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to Play Store
    runs-on: ubuntu-latest

    steps:
      - name: Install
        uses: cluerise/actions/install@v7.5.5
        env:
          NPM_AUTH_TOKEN: ${{ secrets.npm-auth-token }}
          NPM_CONFIG_USERCONFIG: ${{ inputs.npm-config-userconfig }}
        with:
          manager: ${{ inputs.manager }}
          fetch-depth: 20

      - name: Setup Java
        uses: actions/setup-java@v6.1.0
        with:
          java-version: ${{ inputs.java-version }}
          distribution: ${{ inputs.java-distribution }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.1

      - name: Setup Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.android-keystore-base64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > upload-keystore.jks

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.android-keystore-password }}
          KEYSTORE_PATH: ${{ github.workspace }}/upload-keystore.jks
          KEY_ALIAS: ${{ inputs.android-key-alias }}
          KEY_PASSWORD: ${{ secrets.android-key-password }}
          RUN_NUMBER: ${{ github.run_number }}
        run: ${{ inputs.build-command }} -PversionCode=$RUN_NUMBER

      - name: Play Store Authentication
        id: play-store-auth
        uses: google-github-actions/auth@v3
        with:
          service_account: ${{ inputs.play-store-service-account }}
          workload_identity_provider: ${{ inputs.play-store-workload-identity-provider }}

      - name: Get release version
        run: echo "RELEASE_VERSION=$(${{ inputs.get-release-version-command }})" >> $GITHUB_ENV

      - name: Get release name
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: echo "RELEASE_NAME=Version $RELEASE_VERSION ($RUN_NUMBER)" >> $GITHUB_ENV

      - name: Upload
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          releaseName: ${{ env.RELEASE_NAME }}
          packageName: ${{ inputs.package-name }}
          tracks: internal
          status: completed
          releaseFiles: ${{ inputs.package-files }}
          serviceAccountJson: ${{ steps.play-store-auth.outputs.credentials_file_path }}
