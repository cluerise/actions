name: 📊 CI status

on:
  workflow_call:
    inputs:
      app-id:
        type: string
        description: GitHub app ID
      workflow-path:
        type: string
        description: Expected upstream CI workflow file path
        default: .github/workflows/ci.yaml
    secrets:
      token:
        description: GitHub access token
        required: false
      app-private-key:
        description: GitHub app private key
        required: false

permissions:
  statuses: write

jobs:
  send-status:
    name: Send CI status
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.id == github.event.repository.id &&
      github.event.workflow.path == inputs.workflow-path
    concurrency:
      group: ci-status-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: true
    env:
      CI_STATE: pending
      CI_DESCRIPTION: Waiting

    steps:
      - name: Check required secrets
        run: |
          if ${{ secrets.token == '' && (inputs.app-id == '' || secrets.app-private-key == '') }}; then
            echo '::error::Provide a token or both app-id and app-private-key.'
            exit 1
          fi

      - name: Get bot token
        id: get-bot-token
        if: inputs.app-id != ''
        uses: cluerise/actions/get-github-app-token@v7.5.1
        with:
          app-id: ${{ inputs.app-id }}
          app-private-key: ${{ secrets.app-private-key }}

      - name: Set initial state
        if: github.event.action == 'requested'
        run: |
          {
            echo "CI_STATE=pending"
            echo "CI_DESCRIPTION=In progress"
          } >> $GITHUB_ENV

      - name: Set success state
        if: github.event.action == 'completed' && github.event.workflow_run.conclusion == 'success'
        run: |
          {
            echo "CI_STATE=success"
            echo "CI_DESCRIPTION=Passed"
          } >> $GITHUB_ENV

      - name: Set failure state
        if: github.event.action == 'completed' && github.event.workflow_run.conclusion == 'failure'
        run: |
          {
            echo "CI_STATE=failure"
            echo "CI_DESCRIPTION=Failed"
          } >> $GITHUB_ENV

      - name: Send status
        uses: octokit/request-action@b91aabaa861c777dcdb14e2387e30eddf04619ae
        with:
          route: POST /repos/{owner}/{repo}/statuses/{sha}
          owner: ${{ github.event.repository.owner.login }}
          repo: ${{ github.event.repository.name }}
          sha: ${{ github.event.workflow_run.head_sha }}
          context: Status / CI
          state: ${{ env.CI_STATE }}
          description: ${{ env.CI_DESCRIPTION }}
          target_url: ${{ github.event.workflow_run.html_url }}
          GITHUB_TOKEN: ${{ secrets.token || steps.get-bot-token.outputs.token }}
