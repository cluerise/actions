name: 🟢 Update Node.js

on:
  schedule:
    - cron: '0 12 * * 1' # Every Monday at 12:00 UTC
  workflow_dispatch:
  workflow_call:
    inputs:
      app-id:
        description: GitHub app ID
        type: string
      manager:
        description: Package manager (pnpm, npm, or yarn)
        type: string
        default: pnpm
      node-version:
        description: 'Node.js version to use. Examples: 12.x, 10.15.1, >=10.15.0'
        type: string
      node-version-file:
        description: File containing the Node.js version to use
        type: string
        default: .nvmrc
      npm-config-userconfig:
        description: NPM configuration file path
        type: string
      __external-call:
        description: Do not use this input, it is an internal value to identify the workflow_call event
        type: boolean
        default: true
    secrets:
      token:
        description: GitHub access token
        required: false
      app-private-key:
        description: GitHub app private key
        required: false
      npm-auth-token:
        description: NPM authentication token for private packages
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update-node:
    name: Update Node.js
    runs-on: ubuntu-latest

    steps:
      - name: Check required inputs
        if: inputs.__external-call
        run: |
          if ${{
            (secrets.token == '' && (inputs.app-id == '' || secrets.app-private-key == '')) ||
            (secrets.token != '' && (inputs.app-id != '' || secrets.app-private-key != ''))
          }}; then
            echo '::error::Provide either token alone or both app-id and app-private-key without token.'
            exit 1
          fi

      - name: Get app token (internal)
        id: get-app-token-internal
        if: ${{ !inputs.__external-call }}
        uses: cluerise/actions/get-github-app-token@main
        with:
          app-id: ${{ vars.CLUERISE_PUBLIC_BOT_APP_ID }}
          app-private-key: ${{ secrets.CLUERISE_PUBLIC_BOT_APP_PRIVATE_KEY }}

      - name: Get app token (external)
        id: get-app-token-external
        if: inputs.__external-call && inputs.app-id != ''
        uses: cluerise/actions/get-github-app-token@v7.5.2
        with:
          app-id: ${{ inputs.app-id }}
          app-private-key: ${{ secrets.app-private-key }}

      - name: Install (internal)
        if: ${{ !inputs.__external-call }}
        uses: cluerise/actions/install@main

      - name: Install (external)
        env:
          NPM_AUTH_TOKEN: ${{ secrets.npm-auth-token }}
          NPM_CONFIG_USERCONFIG: ${{ inputs.npm-config-userconfig }}
        if: inputs.__external-call
        uses: cluerise/actions/install@v7.5.2
        with:
          manager: ${{ inputs.manager }}
          node-version: ${{ inputs.node-version }}
          node-version-file: ${{ inputs.node-version-file }}

      - name: Update Node.js versions (PNPM)
        id: update-node-versions-pnpm
        if: ${{ !inputs.__external-call || inputs.manager == 'pnpm' }}
        run: pnpm run node-versions-update

      - name: Set updated Node.js version (PNPM)
        if: ${{ !inputs.__external-call || inputs.manager == 'pnpm' }}
        run: echo "UPDATED_NODE_VERSION=${{ steps.update-node-versions-pnpm.outputs.version }}" >> $GITHUB_ENV

      - name: Update Node.js versions (NPM)
        id: update-node-versions-npm
        if: inputs.manager == 'npm'
        run: npm run node-versions-update

      - name: Set updated Node.js version (NPM)
        if: inputs.manager == 'npm'
        run: echo "UPDATED_NODE_VERSION=${{ steps.update-node-versions-npm.outputs.version }}" >> $GITHUB_ENV

      - name: Update Node.js versions (Yarn)
        id: update-node-versions-yarn
        if: inputs.manager == 'yarn'
        run: yarn node-versions-update

      - name: Set updated Node.js version (Yarn)
        if: inputs.manager == 'yarn'
        run: echo "UPDATED_NODE_VERSION=${{ steps.update-node-versions-yarn.outputs.version }}" >> $GITHUB_ENV

      - name: Setup new Node.js (internal)
        if: ${{ !inputs.__external-call }}
        uses: actions/setup-node@v7.1.0
        with:
          cache: pnpm
          node-version-file: .nvmrc

      - name: Setup new Node.js (external)
        if: inputs.__external-call
        uses: actions/setup-node@v7.1.0
        with:
          cache: ${{ inputs.manager }}
          node-version: ${{ inputs.node-version }}
          node-version-file: ${{ inputs.node-version-file }}

      - name: Update the PNPM lock file
        env:
          NPM_AUTH_TOKEN: ${{ secrets.npm-auth-token }}
          NPM_CONFIG_USERCONFIG: ${{ inputs.npm-config-userconfig }}
        if: ${{ !inputs.__external-call || inputs.manager == 'pnpm' }}
        run: pnpm install

      - name: Update the NPM lock file
        env:
          NPM_AUTH_TOKEN: ${{ secrets.npm-auth-token }}
          NPM_CONFIG_USERCONFIG: ${{ inputs.npm-config-userconfig }}
        if: inputs.manager == 'npm'
        run: npm install

      - name: Update the Yarn lock file
        env:
          NPM_AUTH_TOKEN: ${{ secrets.npm-auth-token }}
          NPM_CONFIG_USERCONFIG: ${{ inputs.npm-config-userconfig }}
        if: inputs.manager == 'yarn'
        run: yarn

      - name: Create a pull request with the updated files
        uses: branoholy/update-files-action@main
        with:
          token: ${{ secrets.token || steps.get-app-token-internal.outputs.token || steps.get-app-token-external.outputs.token }}
          branch.name: deps-update-node
          branch.recreate: true
          commit.paths: |
            .nvmrc
            package.json
            pnpm-lock.yaml
            package-lock.json
            yarn.lock
            .github/workflows/*.yaml
          commit.message: 'deps(dev): Update Node.js to ${{ env.UPDATED_NODE_VERSION }}'
          pull-request.body: Automatic update of Node.js to version ${{ env.UPDATED_NODE_VERSION }}.
          pull-request.labels: |
            type: deps
            scope: dev
