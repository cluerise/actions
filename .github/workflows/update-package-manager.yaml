name: 🔩 Update package manager

on:
  schedule:
    - cron: '0 12 * * 2' # Every Tuesday at 12:00 UTC
  workflow_dispatch:
  workflow_call:
    inputs:
      app-id:
        type: string
        description: GitHub app ID
      manager:
        type: string
        description: Package manager (pnpm, npm, or yarn)
        default: pnpm
      node-version:
        type: string
        description: 'Node.js version to use. Examples: 12.x, 10.15.1, >=10.15.0'
      node-version-file:
        type: string
        description: File containing the Node.js version to use
        default: .nvmrc
      npm-config-userconfig:
        type: string
        description: NPM configuration file path
      __external-call:
        type: boolean
        description: Do not use this input, it is an internal value to identify the workflow_call event
        default: true
    secrets:
      token:
        description: GitHub access token
        required: false
      app-private-key:
        description: GitHub app private key
        required: false
      npm-auth-token:
        description: NPM authentication token for private packages
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update-package-manager:
    name: Update package manager
    runs-on: ubuntu-latest

    steps:
      - name: Check required secrets
        if: inputs.__external-call
        run: |
          if ${{ secrets.token == '' && (inputs.app-id == '' || secrets.app-private-key == '') }}; then
            echo "::error::Provide a token or an App ID and private key."
            exit 1
          fi

      - name: Get bot token (main)
        id: get-bot-token-main
        if: ${{ !inputs.__external-call }}
        uses: cluerise/actions/get-github-app-token@main
        with:
          app-id: ${{ vars.CLUERISE_PUBLIC_BOT_APP_ID }}
          app-private-key: ${{ secrets.CLUERISE_PUBLIC_BOT_APP_PRIVATE_KEY }}

      - name: Get bot token (version)
        id: get-bot-token-version
        if: inputs.__external-call && inputs.app-id != ''
        uses: cluerise/actions/get-github-app-token@v7.5.1
        with:
          app-id: ${{ inputs.app-id }}
          app-private-key: ${{ secrets.app-private-key }}

      - name: Install (main)
        if: ${{ !inputs.__external-call }}
        uses: cluerise/actions/install@main

      - name: Install (version)
        env:
          NPM_AUTH_TOKEN: ${{ secrets.npm-auth-token }}
          NPM_CONFIG_USERCONFIG: ${{ inputs.npm-config-userconfig }}
        if: inputs.__external-call
        uses: cluerise/actions/install@v7.5.1
        with:
          manager: ${{ inputs.manager }}
          node-version: ${{ inputs.node-version }}
          node-version-file: ${{ inputs.node-version-file }}

      - name: Set PM name
        if: ${{ !inputs.__external-call || inputs.manager == 'pnpm' }}
        run: echo "PM_NAME=PNPM" >> $GITHUB_ENV

      - name: Update PNPM
        env:
          NPM_AUTH_TOKEN: ${{ secrets.npm-auth-token }}
          NPM_CONFIG_USERCONFIG: ${{ inputs.npm-config-userconfig }}
        if: ${{ !inputs.__external-call || inputs.manager == 'pnpm' }}
        run: corepack enable pnpm && corepack use pnpm@latest
        continue-on-error: true

      - name: Set PNPM engine version
        if: ${{ !inputs.__external-call || inputs.manager == 'pnpm' }}
        run: npm pkg set 'engines.pnpm'=$(pnpm -v)

      - name: Update PNPM lock file
        env:
          NPM_AUTH_TOKEN: ${{ secrets.npm-auth-token }}
          NPM_CONFIG_USERCONFIG: ${{ inputs.npm-config-userconfig }}
        if: ${{ !inputs.__external-call || inputs.manager == 'pnpm' }}
        run: pnpm install

      - name: Set updated PNPM version
        if: ${{ !inputs.__external-call || inputs.manager == 'pnpm' }}
        run: echo "UPDATED_PM_VERSION=$(pnpm -v)" >> $GITHUB_ENV

      - name: Create a pull request with the updated file
        uses: branoholy/update-files-action@main
        with:
          token: ${{ secrets.token || steps.get-bot-token-main.outputs.token || steps.get-bot-token-version.outputs.token }}
          branch.name: deps-update-package-manager
          branch.recreate: true
          commit.paths: |
            package.json
            pnpm-lock.yaml
          commit.message: 'deps(dev): Update ${{ env.PM_NAME }} to ${{ env.UPDATED_PM_VERSION }}'
          pull-request.body: Automatic update of ${{ env.PM_NAME }} to version ${{ env.UPDATED_PM_VERSION }}.
          pull-request.labels: |
            type: deps
            scope: dev
